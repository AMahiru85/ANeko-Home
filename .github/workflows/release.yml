name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            printf 'Invalid version tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package static site
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          mkdir -p release
          (cd dist && zip -qr ../release/ANeko-Home.zip .)
          (cd release && sha256sum ANeko-Home.zip > SHA256SUMS.txt)

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-release
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-release
          path: release

      - name: Verify release files
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          cat > release-notes.md <<EOF
          版本：${tag}
          构建提交：${GITHUB_SHA}

          下载 ANeko-Home.zip，将压缩包内容解压到静态网站目录即可部署。
          压缩包根目录包含 index.html、本地图片、视频和其他静态资源。
          SHA256SUMS.txt 可用于校验下载文件。

          构建记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          prerelease=false
          if [[ "${tag%%+*}" == *-* ]]; then
            prerelease=true
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" release/ANeko-Home.zip release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$tag" \
              --notes-file release-notes.md \
              --prerelease="$prerelease" \
              --draft
            gh release upload "$tag" release/ANeko-Home.zip release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
          publish_flags=(--draft=false --prerelease="$prerelease")
          if [[ "$prerelease" == false ]]; then
            publish_flags+=(--latest)
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" "${publish_flags[@]}"

          printf 'Release: %s/%s/releases/tag/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
