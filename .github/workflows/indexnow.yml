name: Submit IndexNow

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '完整 URL，用空格或换行分隔；留空提交默认页面'
        required: false
        type: string

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out workflow script
        uses: actions/checkout@v4
      - name: Submit changed URLs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_URLS: ${{ inputs.urls }}
        run: node scripts/indexnow-submit.mjs
